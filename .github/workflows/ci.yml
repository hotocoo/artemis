name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Artemis.slnx -p:NoWarn=NU1900 --packages /tmp/nuget-cache --force 2>&1 | tee restore.log
      - name: Upload restore log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log-${{ matrix.os }}
          path: restore.log
      - name: Build (warnings are errors)
        run: dotnet build Artemis.slnx --no-restore -c Release 2>&1 | tee build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
      - name: Unit tests
        run: dotnet test tests/ACT.Tests/ACT.Tests.csproj --no-build -c Release
      - name: Integration tests (lab fixtures, loopback only)
        run: dotnet test tests/ACT.IntegrationTests/ACT.IntegrationTests.csproj --no-build -c Release 2>&1 | tee integration.log
      - name: Upload integration test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log-${{ matrix.os }}
          path: integration.log
      - name: Safety tests (fail-closed invariants)
        run: dotnet test tests/ACT.SecurityTests/ACT.SecurityTests.csproj --no-build -c Release 2>&1 | tee safety.log
      - name: Upload safety test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safety-log-${{ matrix.os }}
          path: safety.log
      - name: Code coverage (unit tests)
        run: dotnet test tests/ACT.Tests/ACT.Tests.csproj --no-build -c Release --collect:"XPlat Code Coverage" --results-directory:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: ignore

  format-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify formatting
        run: dotnet format Artemis.slnx --verify-no-changes

  forbidden-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for prohibited markers in product code
        shell: bash
        run: |
          set -e
          if grep -RInE "TODO|FIXME|HACK\b|NotImplementedException" src --include="*.cs"; then
            echo "::error::Prohibited markers found in product code"
            exit 1
          fi

  # Playwright-driven end-to-end chaos workflow: real built binaries (CLI, console, lab) on real
  # loopback ports through a hostile operator lifecycle - emergency stops mid-flight, crashes,
  # concurrency, triage, reports, audit integrity, persistence. Ubuntu-only to keep the matrix fast.
  e2e-chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build (Release)
        run: dotnet build Artemis.slnx -c Release --nologo -v q
      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run e2e chaos workflow
        working-directory: e2e
        run: node chaos.mjs
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chaos-screenshots
          path: /tmp/artemis-e2e-*/screenshots/
          if-no-files-found: ignore
