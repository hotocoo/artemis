name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: Artemis.slnx
  CONFIGURATION: Release

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Print .NET version
        run: dotnet --version
      - name: Restore packages
        run: dotnet restore ${{ env.SOLUTION }} -p:NoWarn=NU1900 --packages /tmp/nuget-cache --force 2>&1 | tee restore.log
      - name: Upload restore log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log

      - name: Analyze code quality
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --no-restore

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear
      - name: Restore packages
        run: dotnet restore ${{ env.SOLUTION }} -p:NoWarn=NU1900 --packages /tmp/nuget-cache --force 2>&1 | tee restore.log
      - name: Upload restore log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: restore-log
          path: restore.log --packages /tmp/nuget-cache --force --no-cache
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 2>&1 | tee build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
      - name: Run unit tests
        run: dotnet test tests/ACT.Tests/ACT.Tests.csproj --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 --no-build --logger trx
      - name: Run security tests
        run: dotnet test tests/ACT.SecurityTests/ACT.SecurityTests.csproj --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 --no-build --logger trx
      - name: Run integration tests
        run: dotnet test tests/ACT.IntegrationTests/ACT.IntegrationTests.csproj --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 --no-build --logger trx
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore packages
        run: dotnet restore ${{ env.SOLUTION }} -p:NoWarn=NU1900
      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 2>&1 | tee build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
      - name: Run SAST scan
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 -p:RunAnalyzers=true -p:AnalysisLevel=latest
      - name: Generate CycloneDX SBOM
        run: dotnet tool install --global CycloneDX && cyclonedx src/ACT.Cli/ACT.Cli.csproj --output-type json --output-file sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hotocoo/artemis
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push CLI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/ACT.Cli/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, security-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore packages
        run: dotnet restore ${{ env.SOLUTION }} -p:NoWarn=NU1900
      - name: Build CLI
        run: dotnet publish src/ACT.Cli/ACT.Cli.csproj --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 -o publish/cli
      - name: Build Console
        run: dotnet publish src/ACT.Desktop/ACT.Desktop.csproj --configuration ${{ env.CONFIGURATION }} -p:NoWarn=NU1900 -o publish/console
      - name: Create release assets
        run: |
          cd publish
          tar -czf artemis-cli-linux-x64.tar.gz cli/
          tar -czf artemis-console-linux-x64.tar.gz console/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            publish/artemis-cli-linux-x64.tar.gz
            publish/artemis-console-linux-x64.tar.gz
            sbom.json
          generate_release_notes: true
          draft: false
          prerelease: false