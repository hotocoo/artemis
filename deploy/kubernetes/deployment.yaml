apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis-console
  namespace: artemis
  labels:
    app.kubernetes.io/name: artemis-console
    app.kubernetes.io/part-of: artemis
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: artemis-console
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artemis-console
        app.kubernetes.io/part-of: artemis
    spec:
      containers:
        - name: artemis
          image: artemis:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ARTEMIS_DATABASE_PATH
              value: "/data/artemis.db"
            - name: ARTEMIS_LOG_LEVEL
              value: "Information"
            - name: ARTEMIS_CONSOLE_PORT
              value: "8080"
            - name: ARTEMIS_OPEN_BROWSER
              value: "false"
            - name: ARTEMIS_METRICS_ENABLED
              value: "true"
            - name: ARTEMIS_METRICS_PORT
              value: "9090"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: artemis-data
