apiVersion: v1
kind: Service
metadata:
  name: artemis-console
  namespace: artemis
  labels:
    app.kubernetes.io/name: artemis-console
    app.kubernetes.io/part-of: artemis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: artemis-console
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
